services:
  document-extractor:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - ENABLE_DOCS=false
      - REQUIRE_API_KEY=true
      - API_KEY=${API_KEY:-}
      - MAX_WORKERS=8
      - MAX_CONCURRENT_DOWNLOADS=10
      - DOWNLOAD_TIMEOUT_SECONDS=30
      - REQUEST_TIMEOUT_SECONDS=120
      - MAX_FILE_SIZE_MB=50
      - LOG_LEVEL=INFO
      - ENABLE_OCR_FALLBACK=true
      - OCR_LANGUAGE=eng
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
